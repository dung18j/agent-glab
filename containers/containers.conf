# System-wide Podman settings for running containers inside this container
# (installed as /etc/containers/containers.conf). Based on the configuration of
# the upstream quay.io/podman/stable image.
#
# There is no systemd and no cgroup delegation in here, so cgroups are disabled
# and conmon uses cgroupfs. Namespaces that a nested container cannot create
# without extra privileges on the outer one are shared with this container:
# nested containers use this container's network (ports they open are this
# container's ports), IPC and UTS. They still get their own user, mount and PID
# namespaces.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
